services:
  # Laravel app: PHP 8.3 + Composer nằm trong container, không cần cài gì lên máy
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: mariadb   # trong mạng docker, gọi DB bằng tên service
      DB_PORT: "3306"
      MYSQL_DB_HOST: mysql
      MYSQL_DB_PORT: "3306"
    depends_on:
      mariadb:
        condition: service_healthy
      mysql:
        condition: service_healthy

  # MariaDB 10.11.14: GLOBAL sql_mode khởi tạo như dưới; đổi bằng HeidiSQL khi trình bày
  mariadb:
    image: mariadb:10.11.14
    command:
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_ROOT_HOST: "%"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    ports:
      - "3308:3306"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  # MySQL 8.4: chạy song song để chuyển đổi trực tiếp giữa MariaDB và MySQL trên giao diện
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      retries: 20
    ports:
      - "3307:3306"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
